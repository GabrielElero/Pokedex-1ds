<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css?family=Rubik&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <h1>Pokédex</h1>

    <!-- Formulário de busca -->
    <form data-js="search-form" class="search-form">
      <input type="text" data-js="search" placeholder="Buscar por nome ou número..." />
      <button type="submit">Buscar</button>
    </form>

    <ul data-js="pokedex" class="pokedex"></ul>
  </div>

  <script src="./app.js"></script>
</body>

</html>
